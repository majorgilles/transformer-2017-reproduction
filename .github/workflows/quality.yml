name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.0"
          enable-cache: true
          python-version-file: ".python-version"
      - name: Install locked environment
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check exported package
        run: uv run pyright
      - name: Verify nbdev exports are current
        run: |
          uv run nbdev-export
          git diff --exit-code
      - name: Test notebook 00
        run: uv run nbdev-test --path notebooks/00_environment_contract.ipynb
      - name: Smoke-test diagnostics
        run: uv run transformer-env --json
